name: 7-day MT5 paper trading observation (Windows self-hosted)
on:
  workflow_dispatch:
    inputs:
      mt5_symbol:
        description: MT5 symbol to check (e.g., EURUSD, XAUUSD, US500)
        required: false
        default: "EURUSD"
      run_paper_decision:
        description: Also run a paper trading decision after observation
        required: false
        default: "false"
      decision_file:
        description: Path to paper trading decision JSON file (if run_paper_decision=true)
        required: false
        default: ""
  schedule:
    - cron: "45 12 * * 1-5"
    - cron: "35 13 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "15 19 * * 1-5"
    - cron: "45 19 * * 1-5"
permissions:
  contents: read
concurrency:
  group: mt5-paper-trading-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: [self-hosted, windows, windows-mt5]
    timeout-minutes: 15
    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      MT5_PATH: ${{ secrets.MT5_PATH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Configure PowerShell execution policy
        shell: cmd
        run: powershell.exe -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process -Force"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Validate required secrets
        shell: powershell
        run: |
          $missing = @()
          if (-not $env:MT5_LOGIN) { $missing += "MT5_LOGIN" }
          if (-not $env:MT5_PASSWORD) { $missing += "MT5_PASSWORD" }
          if (-not $env:MT5_SERVER) { $missing += "MT5_SERVER" }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required MT5 secrets in GitHub Secrets: $($missing -join ', ')"
            exit 1
          }
      - name: Create temporary MT5 runtime configuration
        shell: cmd
        run: |
          set "envPath=09-API密钥-仅本地/mt5-api.env"
          echo MT5_LOGIN=%MT5_LOGIN% > "%envPath%"
          echo MT5_PASSWORD=*** >> "%envPath%"
          echo MT5_SERVER=%MT5_SERVER% >> "%envPath%"
          if not "%MT5_PATH%"=="" echo MT5_PATH=%MT5_PATH% >> "%envPath%"
       - name: Validate project files
        shell: powershell
        run: |
          $ws = $env:GITHUB_WORKSPACE
          python -m json.tool "$ws\03-定时任务-routines\schedule.json" > $null
          python -m json.tool "$ws\04-运行状态-state\readiness.json" > $null
          python -m json.tool "$ws\05-交易记录-data\current-state-mt5.json" > $null
          python "$ws\06-程序脚本-scripts\mt5_readiness_check.py" --check-config

      - name: Run MT5 observation
        id: observation
        shell: cmd
        run: |
          set "isManual=%GITHUB_EVENT_NAME%"
          set "args="
          if "%GITHUB_EVENT_NAME%"=="workflow_dispatch" set "args=--manual"
          set "symbol=%MT5_SYMBOL%"
          if not "%symbol%"=="" set "args=%args% --symbol %symbol%"
          
          python "06-程序脚本-scripts\run_observation_mt5.py" %args% > observation-output.json 2>&1
          set "exitCode=%ERRORLEVEL%"
          
          type observation-output.json
          
          echo exit_code=%exitCode% >> %GITHUB_OUTPUT%
          exit /b %exitCode%
      - name: Write run summary
        if: always()
        shell: powershell
        run: |
          $symbol = "${{ github.event.inputs.mt5_symbol }}"
          $result = "${{ steps.observation.outputs.exit_code || 'not-run' }}"
          $trigger = "${{ github.event_name }}"
          
          $lines = @(
            "## 7-day MT5 Paper Trading Observation",
            "",
            "- Mode: Paper trading only / MT5 read-only verification (Pepperstone Demo)",
            "- Trigger: $trigger",
            "- Result: $result",
            "- Live orders: Disabled",
            "- Symbol: $symbol",
            ""
          )
          
          if (Test-Path "observation-output.json") {
            $json = Get-Content observation-output.json -Raw
            $lines += "### Output Details"
            $lines += '```json'
            $lines += $json
            $lines += '```'
          }
          
          $summary = $lines -join [Environment]::NewLine
          $summary | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
      - name: Send optional Telegram notification
        if: always()
        shell: powershell
        run: |
          if (-not $env:TELEGRAM_BOT_TOKEN -or -not $env:TELEGRAM_CHAT_ID) {
            Write-Host "Telegram notification not configured; skipping."
            exit 0
          }
          $result = "${{ steps.observation.outputs.exit_code || 'not-run' }}"
          $symbol = "${{ github.event.inputs.mt5_symbol }}"
          $message = "7-day MT5 Experiment: GitHub Actions (Windows) completed. Mode=paper trading only, Symbol=$symbol, ExitCode=$result, Live orders=Disabled. Check Actions for details."
          try {
            $response = Invoke-RestMethod `
              -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
              -Method Post `
              -Body @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $message } `
              -ErrorAction Stop
            Write-Host "Telegram notification sent."
          } catch {
            Write-Warning "Failed to send Telegram notification: $($_.Exception.Message)"
          }
      - name: Remove temporary credentials
        if: always()
        shell: powershell
        run: |
          Remove-Item -Path "09-API密钥-仅本地/mt5-api.env" -Force -ErrorAction SilentlyContinue
      - name: Upload non-secret run records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mt5-paper-trading-record-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            observation-output.json
            04-运行状态-state\readiness.json
            05-交易记录-data\current-state-mt5.json
            05-交易记录-data\journal\*.md
            05-交易记录-data\evidence\*.json
            05-交易记录-data\paper-ledger-mt5.json
  paper-decision:
    needs: observe
    if: github.event_name == 'workflow_dispatch' && inputs.run_paper_decision == 'true'
    runs-on: [self-hosted, windows, windows-mt5]
    timeout-minutes: 10
    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      MT5_PATH: ${{ secrets.MT5_PATH }}
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Configure PowerShell execution policy
        shell: cmd
        run: powershell.exe -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process -Force"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Create temporary MT5 runtime configuration
        shell: cmd
        run: |
          set "envPath=09-API密钥-仅本地/mt5-api.env"
          echo MT5_LOGIN=%MT5_LOGIN% > "%envPath%"
          echo MT5_PASSWORD=*** >> "%envPath%"
          echo MT5_SERVER=%MT5_SERVER% >> "%envPath%"
          if not "%MT5_PATH%"=="" echo MT5_PATH=%MT5_PATH% >> "%envPath%"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Run paper trading decision
        shell: cmd
        run: |
          set "decisionPath=%DECISION_FILE%"
          if "%decisionPath%"=="" exit /b 1
          if not exist "%decisionPath%" exit /b 1
          
          set "runId=gha_mt5_%GITHUB_RUN_ID%_%GITHUB_RUN_ATTEMPT%"
          python "06-程序脚本-scripts\paper_engine_mt5.py" --decision "%decisionPath%" --run-id "%runId%"
      - name: Remove temporary credentials
        if: always()
        shell: powershell
        run: |
          Remove-Item -Path "09-API密钥-仅本地/mt5-api.env" -Force -ErrorAction SilentlyContinue
      - name: Upload paper decision records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mt5-paper-trading-decision-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            05-交易记录-data\current-state-mt5.json
            05-交易记录-data\journal\*.md
            05-交易记录-data\evidence\*.json
            05-交易记录-data\paper-ledger-mt5.json
